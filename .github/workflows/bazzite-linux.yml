name: bazzite-linux

# Linux x86_64 AppImages for Bazzite and other desktop Linux, published as releases of this fork.
# The builds point the in-app updater at this repository, so an installed AppImage updates to the
# fork's next release rather than to upstream's.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the AppImages as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - nx2
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/linux/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/bazzite-linux.yml"

permissions:
  contents: read

env:
  # Must stay at or above the LLVM that wrote eglantine.profdata.
  PGO_LLVM_VERSION: "23"

concurrency:
  group: bazzite-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} AppImage
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
          - platform: linux-x86_64-pgo
            pgo: true
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build \
            libavfilter-dev libavcodec-dev libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtwaylandcompositor
          cache: true

      - name: Install clang for PGO
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          test -s eglantine.profdata

      - name: Restore CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-bazzite-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: cpm-bazzite-

      - name: Restore compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: objects-bazzite-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: objects-bazzite-${{ matrix.platform }}-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=ON
            -DLICHII_BUILD_TAG=build-${{ github.run_number }}
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }}
            -DLICHII_UPDATE_REPO=${{ github.repository }}
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION"
              "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION"
              "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      # Ubuntu 24.04's glibc (2.39) is older than every supported Bazzite release, so the
      # AppImage runs there and on most other current distributions.
      - name: Package AppImage and tar.gz
        shell: bash
        run: |
          set -euo pipefail
          bin=build/release/bin
          test -x $bin/lichii
          test -x $bin/eden-cli
          strip $bin/lichii $bin/eden-cli
          tar -czf "lichii-${{ matrix.platform }}.tar.gz" -C $bin lichii eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          for tool in linuxdeploy linuxdeploy-plugin-qt; do
            curl -fsSL -o "$tools/$tool-x86_64.AppImage" \
              "https://github.com/linuxdeploy/$tool/releases/download/continuous/$tool-x86_64.AppImage"
          done
          chmod +x "$tools"/*.AppImage
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="lichii-${{ matrix.platform }}.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH=x86_64
          "$tools/linuxdeploy-x86_64.AppImage" --appdir AppDir \
            --executable $bin/lichii \
            --executable $bin/eden-cli \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT" "lichii-${{ matrix.platform }}.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-${{ matrix.platform }}
          path: |
            lichii-${{ matrix.platform }}.AppImage
            lichii-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v7
        with:
          pattern: lichii-*
          path: dist
          merge-multiple: true

      # The update checker compares the build-N tag baked into each binary with release tags.
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > notes.md <<EOF
          Linux build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}.

          ## Bazzite

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/linux/bazzite-install.sh | bash
          \`\`\`

          Or download an AppImage, \`chmod +x\` it and run it. See [docs/Bazzite.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/Bazzite.md).

          | | Standard | PGO (Recommended) |
          | --- | --- | --- |
          | x86_64 | [AppImage](${base}/lichii-linux-x86_64.AppImage) · [tar.gz](${base}/lichii-linux-x86_64.tar.gz) | [AppImage](${base}/lichii-linux-x86_64-pgo.AppImage) · [tar.gz](${base}/lichii-linux-x86_64-pgo.tar.gz) |

          The AppImage is self-contained (glibc 2.39 or newer). The tar.gz needs Qt 6.8 or newer and the usual libraries from your system.
          EOF
          gh release create "$tag" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Lichii ${GITHUB_REF_NAME} build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md
